# Build Windows 64-bit dependencies (LibreSSL, libjpeg-turbo, LLVM) and upload deps archive to private store repo
# Mirrors build-macos-deps.yml but targets Windows 64-bit (MSVC 2022).
name: Build Windows 64-bit deps and upload to store

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to use for the store release (optional). If empty a generated tag will be used."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-deps:
    runs-on: windows-2022

    env:
      BASE_DIR: ${{ github.workspace }}/work

      # Glare build scripts expect these environment variables.
      GLARE_CORE_LIBS: ${{ github.workspace }}/work
      WINTER_DIR: ${{ github.workspace }}/work/winter
      GLARE_CORE_TRUNK_DIR: ${{ github.workspace }}/work/glare-core
      CYBERSPACE_OUTPUT: ${{ github.workspace }}/work/substrata_output

      CEF_SUPPORT: "OFF"
      BUILD_CONFIG: "Release"

      STORE_OWNER: "JerryBerry12"
      STORE_REPO: "kingdomvr-store-deps"
      STORE_REPO_PAT: ${{ secrets.STORE_REPO_PAT }}

    steps:
      - name: Fail if STORE_REPO_PAT not set
        shell: bash
        run: |
          if [ -z "$STORE_REPO_PAT" ]; then
            echo "Secret STORE_REPO_PAT is required in this repository (a PAT with repo access to ${STORE_OWNER}/${STORE_REPO})."
            exit 1
          fi

      - name: Checkout this repo (kingdomvr) into work/substrata
        uses: actions/checkout@v4
        with:
          path: work/substrata

      - name: Checkout glare-core (JerryBerry12 fork)
        uses: actions/checkout@v4
        with:
          repository: JerryBerry12/glare-core
          ref: master
          path: work/glare-core

      - name: Checkout winter
        uses: actions/checkout@v4
        with:
          repository: glaretechnologies/winter
          path: work/winter

      - name: Show runner + disk info (before)
        shell: bash
        run: |
          cmake --version || true
          ruby --version || true
          python --version || true
          df -h || true

      - name: Set up MSVC developer environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Setup MSBuild for Visual Studio 2022
        uses: microsoft/setup-msbuild@v2

      - name: Verify Visual Studio C++ components
        shell: pwsh
        run: |
          Write-Host "Checking for Visual Studio 2022 C++ components..."
          $vsPath = "C:\Program Files (x86)\Microsoft Visual Studio\2022\Community"
          $cppPropsPath = "$vsPath\MSBuild\Microsoft\VC\v170\Microsoft.Cpp.Default.props"
          
          if (Test-Path $cppPropsPath) {
            Write-Host "✓ Found C++ props at: $cppPropsPath"
          } else {
            Write-Host "✗ C++ props NOT found at: $cppPropsPath"
            Write-Host "Listing available VC paths:"
            Get-ChildItem "$vsPath\MSBuild\Microsoft\VC" -ErrorAction SilentlyContinue | Format-Table
          }
          
          Write-Host "\nChecking vswhere output:"
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -all

      - name: Setup MSBuild path for Ruby scripts
        shell: pwsh
        run: |
          # Find Visual Studio 2022 and add its MSBuild to PATH
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            Write-Error "Could not find Visual Studio 2022 installation"
            exit 1
          }
          $msbuildPath = Join-Path $vsPath "MSBuild\Current\Bin\MSBuild.exe"
          if (-not (Test-Path $msbuildPath)) {
            Write-Error "Could not find MSBuild at $msbuildPath"
            exit 1
          }
          Write-Host "Found MSBuild at: $msbuildPath"
          # Prepend MSBuild path to PATH so Ruby scripts use the correct one
          $env:PATH = "$(Split-Path $msbuildPath)" + [System.IO.Path]::PathSeparator + $env:PATH
          Add-Content -Path $env:GITHUB_ENV -Value "PATH=$($env:PATH)"

      - name: Create MSBuild wrapper to redirect to VS 2022
        shell: pwsh
        run: |
          # Find VS 2022 MSBuild
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vs2022MsBuild = Join-Path $vsPath "MSBuild\Current\Bin\MSBuild.exe"
          
          # Create a wrapper directory early in PATH
          $wrapperDir = "${{ github.workspace }}\msbuild-wrapper"
          New-Item -ItemType Directory -Path $wrapperDir -Force | Out-Null
          
          # Create batch file wrapper that calls VS 2022 MSBuild
          $wrapperBat = Join-Path $wrapperDir "msbuild.bat"
          $batchContent = "@echo off`nREM Wrapper that redirects to VS 2022 MSBuild`n`"$vs2022MsBuild`" %*"
          Set-Content -Path $wrapperBat -Value $batchContent
          
          # Add wrapper directory to front of PATH
          $env:PATH = "$wrapperDir" + [System.IO.Path]::PathSeparator + $env:PATH
          Add-Content -Path $env:GITHUB_ENV -Value "PATH=$($env:PATH)"
          Write-Host "Created MSBuild wrapper at: $wrapperBat"
          Write-Host "Updated PATH to include: $wrapperDir"

      - name: Install build prerequisites
        shell: pwsh
        run: |
          # ninja is needed by some build scripts; jq is pre-installed on windows-2022 runners
          choco install ninja -y --no-progress

      - name: Prepare directories
        shell: bash
        run: |
          mkdir -p "$BASE_DIR"
          mkdir -p "$CYBERSPACE_OUTPUT"
          mkdir -p "${{ github.workspace }}/logs"

      - name: Build LibreSSL + libjpeg-turbo (Release only)
        working-directory: work/glare-core/scripts
        shell: pwsh
        run: |
          # Run in PowerShell to preserve MSVC environment variables
          $HeartbeatJob = Start-Job -ScriptBlock {
            while ($true) {
              Write-Host "[heartbeat] deps build running: $(Get-Date -Format 'u')"
              Start-Sleep -Seconds 120
            }
          }
          
          try {
            ruby build_libressl.rb --config "$env:BUILD_CONFIG"
            ruby build_jpegturbo.rb --config "$env:BUILD_CONFIG"
          } finally {
            Stop-Job $HeartbeatJob -ErrorAction SilentlyContinue
            Remove-Job $HeartbeatJob -ErrorAction SilentlyContinue
          }

      - name: Build LLVM (Release only, with log + observable progress)
        working-directory: work/glare-core/scripts
        shell: pwsh
        run: |
          $LogDir = "${{ github.workspace }}/logs"
          New-Item -ItemType Directory -Path $LogDir -Force | Out-Null
          $LLVMLog = "$LogDir/llvm_build.log"
          "" | Out-File -FilePath $LLVMLog

          $process = Start-Process ruby -ArgumentList "build_llvm.rb --config $env:BUILD_CONFIG" `
            -RedirectStandardOutput $LLVMLog -RedirectStandardError $LLVMLog -PassThru -NoNewWindow

          $elapsed = 0
          while (-not $process.HasExited) {
            Write-Host "[heartbeat] llvm still running: $(Get-Date -Format 'u') (elapsed ${elapsed}s)"
            If (Test-Path $LLVMLog) {
              $logSize = (Get-Item $LLVMLog).Length
              Write-Host "[llvm log bytes] $logSize"
              $lastLine = @(Get-Content $LLVMLog)[-1]
              if ($lastLine) { Write-Host $lastLine }
            }
            Start-Sleep -Seconds 30
            $elapsed += 30
          }

          $exitCode = $process.ExitCode
          if ($exitCode -ne 0) {
            Write-Host "LLVM build failed. Last 200 lines of log:"
            Get-Content $LLVMLog | Select-Object -Last 200
            exit 1
          }

          Write-Host "LLVM build finished. Last 50 lines of log:"
          Get-Content $LLVMLog | Select-Object -Last 50

      - name: Get additional libs used by Substrata
        working-directory: work/substrata/scripts
        shell: bash
        run: |
          ruby get_libs.rb

      - name: Show disk space (after deps build)
        shell: bash
        run: df -h || true

      - name: Package freshly-created deps (zip, exclude source/build/Qt dirs)
        id: package
        shell: bash
        run: |
          set -euxo pipefail

          ARCHIVE_NAME="kingdomvr-windows-deps-${{ github.run_id }}.zip"
          ARCHIVE_PATH="${{ github.workspace }}/$ARCHIVE_NAME"

          # Zip up BASE_DIR contents, excluding source, build, and Qt dirs (same exclusions as macOS workflow).
          cd "$BASE_DIR"
          7z a -tzip "$ARCHIVE_PATH" . \
            -xr!substrata \
            -xr!glare-core \
            -xr!substrata_build \
            -xr!substrata_output \
            -xr!Qt \
            -xr!winter

          echo "archive_path=$ARCHIVE_PATH" >> "$GITHUB_OUTPUT"
          echo "archive_name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"

      - name: Create release in private store repo and upload asset
        shell: bash
        env:
          STORE_REPO_PAT: ${{ secrets.STORE_REPO_PAT }}
        run: |
          set -euxo pipefail

          ARCHIVE_PATH="${{ steps.package.outputs.archive_path }}"
          ARCHIVE_NAME="${{ steps.package.outputs.archive_name }}"

          TAG_INPUT="${{ github.event.inputs.tag_name }}"
          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          else
            TAG="windows-deps-${GITHUB_RUN_ID}"
          fi

          API="https://api.github.com/repos/${STORE_OWNER}/${STORE_REPO}/releases"

          echo "Creating draft release ${TAG} in ${STORE_OWNER}/${STORE_REPO}"
          CREATE_RESP=$(curl -s -X POST -H "Authorization: token ${STORE_REPO_PAT}" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"draft\":true}" \
            "$API")

          UPLOAD_URL=$(echo "$CREATE_RESP" | jq -r .upload_url)
          if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "null" ]; then
            echo "Failed to create release. Response:"
            echo "$CREATE_RESP"
            exit 1
          fi

          UPLOAD_URL="${UPLOAD_URL%\{*}"

          echo "Uploading asset ${ARCHIVE_NAME}"
          curl -s --data-binary @"${ARCHIVE_PATH}" -H "Authorization: token ${STORE_REPO_PAT}" -H "Content-Type: application/zip" \
            "${UPLOAD_URL}?name=${ARCHIVE_NAME}" | jq -r .

          echo "Uploaded ${ARCHIVE_NAME} to ${STORE_OWNER}/${STORE_REPO} (draft release ${TAG})."
