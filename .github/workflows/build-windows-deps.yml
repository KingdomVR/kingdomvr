# Build Windows 64-bit dependencies (LibreSSL, libjpeg-turbo, LLVM) and upload deps archive to private store repo
# Mirrors build-macos-deps.yml but targets Windows 64-bit (MSVC 2022).
name: Build Windows 64-bit deps and upload to store

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to use for the store release (optional). If empty a generated tag will be used."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-deps:
    runs-on: windows-2022

    env:
      BASE_DIR: ${{ github.workspace }}/work
      # Glare build scripts expect these environment variables.
      GLARE_CORE_LIBS: ${{ github.workspace }}/work
      WINTER_DIR: ${{ github.workspace }}/work/winter
      GLARE_CORE_TRUNK_DIR: ${{ github.workspace }}/work/glare-core
      CYBERSPACE_OUTPUT: ${{ github.workspace }}/work/substrata_output

      CEF_SUPPORT: "OFF"
      BUILD_CONFIG: "Release"

      STORE_OWNER: "JerryBerry12"
      STORE_REPO: "kingdomvr-store-deps"
      STORE_REPO_PAT: ${{ secrets.STORE_REPO_PAT }}

    steps:
      - name: Check STORE_REPO_PAT secret at runtime
        shell: bash
        run: |
          if [ -z "$STORE_REPO_PAT" ]; then
            echo "Secret STORE_REPO_PAT is required in this repository (a PAT with repo access to ${STORE_OWNER}/${STORE_REPO})."
            exit 1
          fi

      - name: Checkout this repo (kingdomvr) into work/substrata
        uses: actions/checkout@v4
        with:
          path: work/substrata

      - name: Checkout glare-core (JerryBerry12 fork)
        uses: actions/checkout@v4
        with:
          repository: JerryBerry12/glare-core
          ref: master
          path: work/glare-core

      - name: Checkout winter
        uses: actions/checkout@v4
        with:
          repository: glaretechnologies/winter
          path: work/winter

      - name: Prepare for Visual Studio/msbuild builds
        shell: pwsh
        run: |
          Write-Host "Using Visual Studio generator (msbuild) for Windows builds; no Ninja override."


      - name: Show runner + disk info (before)
        shell: bash
        run: |
          cmake --version || true
          ruby --version || true
          python --version || true
          df -h || true

      - name: Set up MSVC developer environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Setup MSBuild for Visual Studio 2022
        uses: microsoft/setup-msbuild@v2

      - name: Verify Visual Studio C++ components
        shell: pwsh
        run: |
          Write-Host "Checking for Visual Studio 2022 C++ components..."
          $vsPath = "C:\Program Files (x86)\Microsoft Visual Studio\2022\Community"
          $cppPropsPath = "$vsPath\MSBuild\Microsoft\VC\v170\Microsoft.Cpp.Default.props"
          
          if (Test-Path $cppPropsPath) {
            Write-Host "✓ Found C++ props at: $cppPropsPath"
          } else {
            Write-Host "✗ C++ props NOT found at: $cppPropsPath"
            Write-Host "Listing available VC paths:"
            Get-ChildItem "$vsPath\MSBuild\Microsoft\VC" -ErrorAction SilentlyContinue | Format-Table
          }
          
          Write-Host "\nChecking vswhere output:"
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -all

      - name: Setup MSBuild path for Ruby scripts
        shell: pwsh
        run: |
          # Find Visual Studio 2022 and add its MSBuild to PATH
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            Write-Error "Could not find Visual Studio 2022 installation"
            exit 1
          }
          $msbuildPath = Join-Path $vsPath "MSBuild\Current\Bin\MSBuild.exe"
          if (-not (Test-Path $msbuildPath)) {
            Write-Error "Could not find MSBuild at $msbuildPath"
            exit 1
          }
          Write-Host "Found MSBuild at: $msbuildPath"
          # Prepend MSBuild path to PATH so Ruby scripts use the correct one
          $env:PATH = "$(Split-Path $msbuildPath)" + [System.IO.Path]::PathSeparator + $env:PATH
          Add-Content -Path $env:GITHUB_ENV -Value "PATH=$($env:PATH)"

      - name: Create MSBuild wrapper to redirect to VS 2022
        shell: pwsh
        run: |
          # Find VS 2022 MSBuild
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vs2022MsBuild = Join-Path $vsPath "MSBuild\Current\Bin\MSBuild.exe"
          
          # Create a wrapper directory early in PATH
          $wrapperDir = "${{ github.workspace }}\msbuild-wrapper"
          New-Item -ItemType Directory -Path $wrapperDir -Force | Out-Null
          
          # Create batch file wrapper that calls VS 2022 MSBuild
          $wrapperBat = Join-Path $wrapperDir "msbuild.bat"
          $batchContent = "@echo off`nREM Wrapper that redirects to VS 2022 MSBuild`n`"$vs2022MsBuild`" %*"
          Set-Content -Path $wrapperBat -Value $batchContent
          
          # Add wrapper directory to front of PATH
          $env:PATH = "$wrapperDir" + [System.IO.Path]::PathSeparator + $env:PATH
          Add-Content -Path $env:GITHUB_ENV -Value "PATH=$($env:PATH)"
          Write-Host "Created MSBuild wrapper at: $wrapperBat"
          Write-Host "Updated PATH to include: $wrapperDir"

      - name: Print and fix MSBuildExtensionsPath
        shell: pwsh
        run: |
          # Diagnostic: Check current MSBuildExtensionsPath
          Write-Host "Current MSBuildExtensionsPath: $env:MSBuildExtensionsPath"
          
          # Find VS 2022 installation
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $correctMSBuildPath = Join-Path $vsPath "MSBuild"
          
          Write-Host "Correct MSBuildExtensionsPath should be: $correctMSBuildPath"
          
          # Force correct path in environment
          $env:MSBuildExtensionsPath = $correctMSBuildPath
          Add-Content -Path $env:GITHUB_ENV -Value "MSBuildExtensionsPath=$correctMSBuildPath"
          
          # Also set MSBuildSDKsPath for completeness
          $env:MSBuildSDKsPath = "$vsPath\MSBuild\Current\SDKs"
          Add-Content -Path $env:GITHUB_ENV -Value "MSBuildSDKsPath=$($env:MSBuildSDKsPath)"
          
          Write-Host "✓ Set MSBuildExtensionsPath to: $correctMSBuildPath"
          Write-Host "✓ Set MSBuildSDKsPath to: $($env:MSBuildSDKsPath)"

      - name: Debug environment before build
        shell: pwsh
        run: |
          Write-Host "=== BEFORE BUILD DEBUG ==="
          Write-Host ""
          Write-Host "PATH entries:"
          $env:PATH -split [System.IO.Path]::PathSeparator | ForEach-Object { Write-Host "  $_" }
          
          Write-Host ""
          Write-Host "Critical env vars:"
          Write-Host "  MSBuildExtensionsPath = $env:MSBuildExtensionsPath"
          Write-Host "  VCTargetsPath = $env:VCTargetsPath"
          Write-Host "  VSINSTALLDIR = $env:VSINSTALLDIR"
          
          Write-Host ""
          Write-Host "Which msbuild.exe will Ruby find:"
          & where.exe msbuild.exe 2>&1 | ForEach-Object { Write-Host "  $_" }

      - name: Install build prerequisites
        shell: pwsh
        run: |
          # Ensure common tools are available; msbuild is provided by the VS images.
          Write-Host "No Ninja install required; using Visual Studio/msbuild on windows-2022 runners."

      - name: Prepare directories
        shell: bash
        run: |
          mkdir -p "$BASE_DIR"
          mkdir -p "$CYBERSPACE_OUTPUT"
          mkdir -p "${{ github.workspace }}/logs"

      - name: Ensure VS MSBuild & VCTargetsPath
        shell: pwsh
        run: |
          Write-Host "Locating Visual Studio installation with C++ tools..."
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            Write-Error "Visual Studio with C++ components not found via vswhere"
            exit 1
          }

      - name: Pre-configure LibreSSL build (force generator/platform)
        shell: pwsh
        run: |
          Write-Host "Pre-configuring LibreSSL build directory to ensure MSBuild probes x64 configuration"
          $src = "${{ github.workspace }}\work\LibreSSL\libressl-3.5.2"
          $build = "${{ github.workspace }}\work\LibreSSL\libressl-3.5.2-x64-vs2022-build"
          $inst = "${{ github.workspace }}\work\LibreSSL\libressl-3.5.2-x64-vs2022-install"
          mkdir -Force $build | Out-Null
          cmake $src -B $build -G "Visual Studio 17 2022" -A x64 -T v143 -DCMAKE_INSTALL_PREFIX:"$inst" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
          if ($LASTEXITCODE -ne 0) { Write-Error "cmake pre-configure failed"; exit $LASTEXITCODE }

          $msbuildDir = Join-Path $vsPath 'MSBuild\Current\Bin'
          Write-Host "Prepending MSBuild directory to PATH: $msbuildDir"
          $env:PATH = "$msbuildDir;" + $env:PATH
          Add-Content -Path $env:GITHUB_ENV -Value "PATH=$env:PATH"

          $msBuildExt = Join-Path $vsPath 'MSBuild'
          Write-Host "Setting MSBuildExtensionsPath to: $msBuildExt"
          Add-Content -Path $env:GITHUB_ENV -Value "MSBuildExtensionsPath=$msBuildExt"
          $env:MSBuildExtensionsPath = $msBuildExt

          # Locate Microsoft.Cpp.Default.props under the VS MSBuild tree and set VCTargetsPath accordingly
          Write-Host "Searching for Microsoft.Cpp.Default.props under: $(Join-Path $vsPath 'MSBuild\Microsoft\VC')"
          $propsFile = Get-ChildItem -Path (Join-Path $vsPath 'MSBuild\Microsoft\VC') -Recurse -Filter Microsoft.Cpp.Default.props -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($propsFile) {
            $vcTargetsPath = Split-Path $propsFile.FullName -Parent
            Write-Host "Found props at: $($propsFile.FullName)"
            Write-Host "Setting VCTargetsPath = $vcTargetsPath"
            Add-Content -Path $env:GITHUB_ENV -Value "VCTargetsPath=$vcTargetsPath"
            $env:VCTargetsPath = $vcTargetsPath
          } else {
            Write-Host "Microsoft.Cpp.Default.props not found under MSBuild VC tree; falling back to MSVC VCTargets location"
            $msvcTools = Get-ChildItem (Join-Path $vsPath 'VC\Tools\MSVC') -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
            if (-not $msvcTools) {
              Write-Error "MSVC Tools folder not found under $vsPath\\VC\\Tools\\MSVC"
              exit 1
            }
            $vcTargets = Join-Path $msvcTools.FullName 'VCTargets'
            Write-Host "Setting VCTargetsPath = $vcTargets"
            Add-Content -Path $env:GITHUB_ENV -Value "VCTargetsPath=$vcTargets"
            $env:VCTargetsPath = $vcTargets
          }

      - name: Build LibreSSL + libjpeg-turbo (Release only)
        working-directory: work/glare-core/scripts
        shell: pwsh
        env:
          CMAKE_GENERATOR: "Visual Studio 17 2022"
          CMAKE_GENERATOR_PLATFORM: "x64"
          CMAKE_GENERATOR_TOOLSET: "v143"
        run: |
          Write-Host "=== LIBRESSL/JPEG BUILD ==="
          
          # Use the Visual Studio generator (msbuild) provided by the VS toolchain
          Write-Host "MSVC compiler: $(& where.exe cl.exe | Select-Object -First 1)"
          
          $HeartbeatJob = Start-Job -ScriptBlock {
            while ($true) {
              Write-Host "[heartbeat] $(Get-Date -Format 'u')"
              Start-Sleep -Seconds 120
            }
          }
          
          try {
            Write-Host ""
            Write-Host "=== LIBRESSL BUILD ==="
            & ruby build_libressl.rb --config "$env:BUILD_CONFIG"
            if ($LASTEXITCODE -ne 0) { 
              Write-Error "LibreSSL FAILED (exit: $LASTEXITCODE)"; exit $LASTEXITCODE 
            }
            
            Write-Host ""
            Write-Host "=== JPEG BUILD ==="
            & ruby build_jpegturbo.rb --config "$env:BUILD_CONFIG"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "JPEG FAILED (exit: $LASTEXITCODE)"; exit $LASTEXITCODE
            }

          
            
            Write-Host ""
            Write-Host "✓ Both builds succeeded"
          } finally {
            Stop-Job $HeartbeatJob -ErrorAction SilentlyContinue
            Remove-Job $HeartbeatJob -ErrorAction SilentlyContinue
          }

      - name: Build LLVM (Release only, using Visual Studio / msbuild)
        working-directory: work/glare-core/scripts
        shell: pwsh
        run: |
          Write-Host "=== LLVM BUILD (msbuild) ==="
          Write-Host "MSVC compiler: $(& where.exe cl.exe | Select-Object -First 1)"

          $LogDir = "${{ github.workspace }}/logs"
          New-Item -ItemType Directory -Path $LogDir -Force | Out-Null
          $LLVMLog = "$LogDir/llvm_build.log"

          Write-Host "Starting LLVM build (msbuild via Visual Studio generator)..." 
          & ruby build_llvm.rb --config "$env:BUILD_CONFIG" 2>&1 | Tee-Object -FilePath $LLVMLog

          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Host ""
            Write-Host "=== LLVM FAILED (exit: $exitCode) ===" 
            Write-Host "Last 150 lines of log:"
            Get-Content $LLVMLog -ErrorAction SilentlyContinue | Select-Object -Last 150
            exit $exitCode
          }

          Write-Host ""
          Write-Host "✓ LLVM build succeeded"



      - name: Pre-check LLVM build configuration
        shell: pwsh
        run: |
          Write-Host "=== PRE-CHECK: LLVM build configuration ==="
          Write-Host "BUILD_CONFIG = '$env:BUILD_CONFIG'"
          if ($env:BUILD_CONFIG -match '^(Debug|SDKDebug)$') {
            Write-Error "Refusing to build LLVM in Debug/SDKDebug configuration: $env:BUILD_CONFIG"
            exit 1
          }
          Write-Host "CMAKE_GENERATOR = '$env:CMAKE_GENERATOR'"
          if (-not $env:CMAKE_MSVC_RUNTIME_LIBRARY) {
            Write-Host "CMAKE_MSVC_RUNTIME_LIBRARY not set; cmake.rb may choose default runtime."
          } else {
            Write-Host "CMAKE_MSVC_RUNTIME_LIBRARY = '$env:CMAKE_MSVC_RUNTIME_LIBRARY'"
          }
          Write-Host "Pre-check passed: proceeding to LLVM build"

      - name: Verify LLVM install libs use release CRT
        shell: pwsh
        run: |
          Write-Host "=== VERIFY LLVM CRT LINKAGE ==="

          $llvmRoot = "$env:BASE_DIR\\llvm"
          if (-not (Test-Path $llvmRoot)) {
            Write-Error "LLVM root not found: $llvmRoot"
            exit 1
          }

          $installLibDirs = Get-ChildItem $llvmRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "*_install_vs2022_64" } |
            ForEach-Object { Join-Path $_.FullName "lib" } |
            Where-Object { Test-Path $_ }

          if (-not $installLibDirs -or $installLibDirs.Count -eq 0) {
            Write-Error "No LLVM install lib directories found under $llvmRoot"
            Get-ChildItem $llvmRoot -Directory -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }

          Write-Host "Scanning install lib dirs:"
          $installLibDirs | ForEach-Object { Write-Host " - $_" }

          $debugCrtPattern = 'MSVCRTD|MSVCPRTD|LIBCMTD|UCRTD|VCRUNTIMED|msvcrtd|msvcprtd|libcmtd|ucrtd|vcruntimed'
          $offenders = @()

          foreach ($libDir in $installLibDirs) {
            Get-ChildItem -Recurse $libDir -Filter *.lib -File -ErrorAction SilentlyContinue | ForEach-Object {
              $libFile = $_.FullName
              try {
                $defaultLibLines = & dumpbin /directives $libFile 2>$null | Select-String 'DEFAULTLIB' | ForEach-Object { $_.Line }
                if ($defaultLibLines) {
                  $debugMatches = $defaultLibLines | Select-String $debugCrtPattern
                  if ($debugMatches) {
                    $offenders += [PSCustomObject]@{
                      File = $libFile
                      DebugDirectives = (($debugMatches | ForEach-Object { $_.Line.Trim() } | Select-Object -Unique) -join '; ')
                    }
                  }
                }
              } catch {
                Write-Host "  (failed dumpbin on $libFile)"
              }
            }
          }

          if ($offenders.Count -gt 0) {
            Write-Host "Found $($offenders.Count) LLVM install libs with debug CRT directives (showing up to 80):"
            $offenders | Select-Object -First 80 | ForEach-Object {
              Write-Host " - $($_.File)"
              Write-Host "   $($_.DebugDirectives)"
            }
            Write-Error "LLVM install artifacts are not Release CRT-compatible; refusing to package deps."
            exit 1
          }

          Write-Host "✓ LLVM install libs appear release CRT-compatible"

      - name: Get additional libs used by Substrata
        working-directory: work/substrata/scripts
        shell: bash
        run: |
          ruby get_libs.rb

      - name: Show disk space (after deps build)
        shell: bash
        run: df -h || true

      - name: Package freshly-created deps (split 7z, exclude source/build/Qt dirs)
        id: package
        shell: bash
        run: |
          set -euxo pipefail

          ARCHIVE_STEM="${{ github.workspace }}/kingdomvr-windows-deps-${{ github.run_id }}.7z"

          # Archive BASE_DIR contents, excluding source, build, and Qt dirs.
          # Use split 7z volumes to stay under GitHub's 2GB per-asset limit.
          cd "$BASE_DIR"
          7z a -t7z -mx=9 -v1900m "$ARCHIVE_STEM" . \
            -xr!substrata \
            -xr!glare-core \
            -xr!substrata_build \
            -xr!substrata_output \
            -xr!Qt \
            -xr!winter

          FIRST_PART="${ARCHIVE_STEM}.001"
          if [ ! -f "$FIRST_PART" ]; then
            echo "ERROR: First archive part not found at $FIRST_PART"
            exit 1
          fi

          PART_COUNT=$(ls -1 "${ARCHIVE_STEM}".* | wc -l)
          echo "Created split archive parts: $PART_COUNT"
          ls -lh "${ARCHIVE_STEM}".*

          echo "archive_stem=$ARCHIVE_STEM" >> "$GITHUB_OUTPUT"
          echo "archive_first_part=$FIRST_PART" >> "$GITHUB_OUTPUT"

      - name: Create release in private store repo and upload assets
        shell: bash
        env:
          STORE_REPO_PAT: ${{ secrets.STORE_REPO_PAT }}
        run: |
          set -euxo pipefail

          ARCHIVE_STEM="${{ steps.package.outputs.archive_stem }}"

          TAG_INPUT="${{ github.event.inputs.tag_name }}"
          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          else
            TAG="windows-deps-${GITHUB_RUN_ID}"
          fi

          API="https://api.github.com/repos/${STORE_OWNER}/${STORE_REPO}/releases"

          echo "Creating draft release ${TAG} in ${STORE_OWNER}/${STORE_REPO}"
          CREATE_RESP=$(curl -s -X POST -H "Authorization: token ${STORE_REPO_PAT}" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"draft\":true}" \
            "$API")

          UPLOAD_URL=$(echo "$CREATE_RESP" | jq -r .upload_url)
          if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "null" ]; then
            echo "Failed to create release. Response:"
            echo "$CREATE_RESP"
            exit 1
          fi

          UPLOAD_URL="${UPLOAD_URL%\{*}"

          PART_FILES=$(ls -1 "${ARCHIVE_STEM}".* | sort)
          if [ -z "$PART_FILES" ]; then
            echo "ERROR: No archive parts found for stem ${ARCHIVE_STEM}"
            exit 1
          fi

          for part in $PART_FILES; do
            part_name="$(basename "$part")"
            echo "Uploading asset ${part_name}"

            PART_SIZE_BYTES=$(wc -c < "$part")
            MAX_BYTES=2147483647
            if [ "$PART_SIZE_BYTES" -gt "$MAX_BYTES" ]; then
              echo "ERROR: Part ${part_name} exceeds GitHub release asset limit (2GB)."
              exit 1
            fi

            UPLOAD_RESP=$(curl -s --data-binary @"${part}" \
              -H "Authorization: token ${STORE_REPO_PAT}" \
              -H "Content-Type: application/x-7z-compressed" \
              "${UPLOAD_URL}?name=${part_name}")

            echo "$UPLOAD_RESP" | jq -r .

            ASSET_ID=$(echo "$UPLOAD_RESP" | jq -r '.id // empty')
            if [ -z "$ASSET_ID" ]; then
              echo "ERROR: Upload failed for ${part_name}. GitHub did not return an asset id."
              exit 1
            fi
          done

          echo "Uploaded split deps archive to ${STORE_OWNER}/${STORE_REPO} (draft release ${TAG})."
