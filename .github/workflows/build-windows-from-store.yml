# Build Windows 64-bit gui_client using stored deps (Release, no CEF)
# Mirrors build-macos-from-store.yml but targets Windows 64-bit (MSVC 2022).
# Qt 5.15.16 is installed via aqtinstall (prebuilt MSVC 2019 x64 binaries, binary-compatible with MSVC 2022).
name: Build Windows 64-bit gui_client using stored deps (Release, no CEF)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "If true, create a GitHub Release and upload the zip there"
        required: true
        default: "false"
      tag_name:
        description: "Release tag (required if create_release=true), e.g. v0.1.0"
        required: false
      deps_release_tag:
        description: "Tag in the deps store repo to download (optional). If empty, use latest."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022

    env:
      BASE_DIR: ${{ github.workspace }}/work
      CMAKE_GENERATOR: "Visual Studio 17 2022"
      CMAKE_GENERATOR_PLATFORM: "x64"
      CMAKE_GENERATOR_TOOLSET: "v143"

      # Glare build scripts expect these environment variables.
      GLARE_CORE_LIBS: ${{ github.workspace }}/work
      WINTER_DIR: ${{ github.workspace }}/work/winter
      GLARE_CORE_TRUNK_DIR: ${{ github.workspace }}/work/glare-core
      CYBERSPACE_OUTPUT: ${{ github.workspace }}/work/substrata_output

      CEF_SUPPORT: "OFF"
      BUILD_CONFIG: "Release"

      STORE_OWNER: "JerryBerry12"
      STORE_REPO: "kingdomvr-store-deps"

    steps:
      - name: Check STORE_REPO_PAT secret at runtime
        shell: bash
        run: |
          if [ -z "${{ secrets.STORE_REPO_PAT }}" ]; then
            echo "Secret STORE_REPO_PAT is required in this repository (a PAT with repo access to ${STORE_OWNER}/${STORE_REPO})."
            exit 1
          fi

      - name: Set up MSVC developer environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install CMake 3.29.6 (pin version)
        shell: pwsh
        run: |
          $targetVersion = '3.29.6'
          choco install cmake --version=$targetVersion -y --no-progress

          # Find the installed CMake matching the target version
          $candidates = @()
          try {
            $candidates = Get-Command cmake.exe -All | Select-Object -ExpandProperty Source
          } catch {
            Write-Error "cmake.exe not found after installation."
            exit 1
          }

          $selected = $null
          foreach ($path in $candidates) {
            try {
              $out = & $path --version 2>$null
              if ($out -match "cmake version $targetVersion") {
                $selected = $path
                break
              }
            } catch {
              # ignore candidate errors
            }
          }

          if (-not $selected) {
            Write-Host "Available cmake.exe candidates after install:"
            $candidates | ForEach-Object { Write-Host " - $_" }
            Write-Error "Failed to find CMake $targetVersion in PATH after installation."
            exit 1
          }

          Write-Host "Using pinned CMake $targetVersion at: $selected"
          Add-Content -Path $env:GITHUB_ENV -Value "PINNED_CMAKE=$selected"
          & $selected --version

      - name: Show runner + disk info (before)
        shell: bash
        run: |
          cmake --version || true
          ruby --version || true
          python --version || true
          df -h || true

      - name: Download deps archive from store repository
        id: download_asset
        shell: bash
        env:
          STORE_REPO_PAT: ${{ secrets.STORE_REPO_PAT }}
        run: |
          set -euxo pipefail

          TAG_INPUT="${{ github.event.inputs.deps_release_tag }}"
          API="https://api.github.com/repos/${STORE_OWNER}/${STORE_REPO}"

          if [ -n "$TAG_INPUT" ]; then
            echo "Using provided deps tag: $TAG_INPUT"
            REL_RESP=$(curl -s -H "Authorization: token ${STORE_REPO_PAT}" "${API}/releases/tags/${TAG_INPUT}")
          else
            echo "Getting latest deps release"
            REL_RESP=$(curl -s -H "Authorization: token ${STORE_REPO_PAT}" "${API}/releases/latest")
          fi

          echo "Release assets:"
          echo "$REL_RESP" | jq -r '.assets[].name // empty'

          # Preferred format: split 7z parts (.7z.001, .7z.002, ...)
          FIRST_PART_NAME=$(echo "$REL_RESP" | jq -r '.assets[] | select(.name | test("^kingdomvr-windows-deps-.*\\.7z\\.001$")) | .name' | head -n1)

          if [ -n "$FIRST_PART_NAME" ] && [ "$FIRST_PART_NAME" != "null" ]; then
            STEM="${FIRST_PART_NAME%.001}"
            echo "Found split archive stem: $STEM"

            echo "$REL_RESP" | jq -r --arg stem "$STEM" '.assets[] | select((.name | startswith($stem + ".")) and (.name | test("\\.7z\\.[0-9]{3}$"))) | [.name, .url] | @tsv' \
              | sort \
              | while IFS=$'\t' read -r part_name part_url; do
                  # Strip carriage returns from URLs that may have CRLF line endings
                  part_url=$(echo "$part_url" | tr -d '\r')
                  
                  DEST="${{ github.workspace }}/$part_name"
                  echo "Downloading part: $part_name"
                  curl -L -H "Authorization: token ${STORE_REPO_PAT}" -H "Accept: application/octet-stream" \
                    -o "$DEST" "$part_url"
                done

            echo "downloaded_asset=${{ github.workspace }}/$FIRST_PART_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ERROR: No split Windows deps archive found. Expected assets matching: kingdomvr-windows-deps-*.7z.001"
          exit 1

      - name: Extract archive into BASE_DIR
        shell: bash
        run: |
          set -euxo pipefail

          ARCHIVE="${{ steps.download_asset.outputs.downloaded_asset }}"
          if [ -z "$ARCHIVE" ] || [ ! -f "$ARCHIVE" ]; then
            echo "Archive not found at $ARCHIVE - attempting fallback search"
            ARCHIVE="$(ls "${GITHUB_WORKSPACE}"/*kingdomvr-windows-deps*.7z.001 2>/dev/null | head -n1 || true)"
            echo "Fallback archive: $ARCHIVE"
          fi
          if [ -z "$ARCHIVE" ] || [ ! -f "$ARCHIVE" ]; then
            echo "Archive not found."
            ls -la "${GITHUB_WORKSPACE}"
            exit 1
          fi
          mkdir -p "$BASE_DIR"
          7z x "$ARCHIVE" -o"$BASE_DIR" -y
          echo "Extracted $ARCHIVE -> $BASE_DIR"

      - name: Verify extracted prebuilt deps
        shell: bash
        run: |
          set -euxo pipefail

          REQUIRED=(
            "$BASE_DIR/LibreSSL/libressl-3.5.2-x64-vs2022-install/include/tls.h"
            "$BASE_DIR/LibreSSL/libressl-3.5.2-x64-vs2022-install/include/openssl/crypto.h"
            "$BASE_DIR/llvm/llvm_15_0_7_install_vs2022_64/include/llvm/IR/IRBuilder.h"
            "$BASE_DIR/libjpeg-turbo/libjpeg-turbo-3.0.0-vs2022-install/include/jpeglib.h"
          )

          MISSING=0
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "$f" ]; then
              echo "Missing required file: $f"
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            echo "Dependency restore is incomplete. Top-level BASE_DIR contents:"
            ls -la "$BASE_DIR" || true
            exit 1
          fi

          echo "✓ Prebuilt dependency verification passed"

      - name: Checkout this repo (kingdomvr) into work/substrata (reclone)
        uses: actions/checkout@v4
        with:
          path: work/substrata

      - name: Checkout glare-core (JerryBerry12 fork) (reclone)
        uses: actions/checkout@v4
        with:
          repository: JerryBerry12/glare-core
          ref: master
          path: work/glare-core

      - name: Checkout winter (reclone)
        uses: actions/checkout@v4
        with:
          repository: glaretechnologies/winter
          path: work/winter

      - name: Prepare for Visual Studio/msbuild builds
        shell: pwsh
        run: |
          Write-Host "Using Visual Studio generator (msbuild) for Windows builds; no Ninja override."

      - name: Provide Qt 5.15.2 for Windows (via aqtinstall)
        shell: bash
        run: |
          set -euxo pipefail

          (while true; do
            echo "[heartbeat] Qt installation running: $(date -u)"
            sleep 120
          done) &
          HEARTBEAT_PID=$!

          # Note: Qt 5.15.16 requires commercial license for pre-built binaries.
          # Using 5.15.2 (latest open-source) which is binary-compatible within 5.15.x LTS series.
          # Match the directory structure expected by build_qt.rb: $GLARE_CORE_LIBS/Qt/5.15.16-vs2022-64/
          
          QT_INSTALL_ROOT="$GLARE_CORE_LIBS/Qt"
          QT_TARGET_DIR="$QT_INSTALL_ROOT/5.15.16-vs2022-64"
          mkdir -p "$QT_INSTALL_ROOT"
          
          pip install aqtinstall
          
          echo "Installing Qt 5.15.2 MSVC 2019 64-bit (binary-compatible with MSVC 2022)..."
          aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 \
            -O "$QT_INSTALL_ROOT" \
            -m qtmultimedia qtgamepad || {
              echo "WARNING: Module installation failed, trying without modules..."
              aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -O "$QT_INSTALL_ROOT"
            }
          
          # Copy from aqt's layout to project's expected path
          # aqt creates: $QT_INSTALL_ROOT/5.15.2/msvc2019_64/
          # Project expects: $QT_INSTALL_ROOT/5.15.16-vs2022-64/
          if [ -d "$QT_INSTALL_ROOT/5.15.2/msvc2019_64" ]; then
            mkdir -p "$QT_TARGET_DIR"
            cp -r "$QT_INSTALL_ROOT/5.15.2/msvc2019_64"/* "$QT_TARGET_DIR/"
          else
            echo "ERROR: Qt installation directory not found"
            ls -la "$QT_INSTALL_ROOT" || true
            kill $HEARTBEAT_PID || true
            exit 1
          fi

          # Verify installation
          if [ ! -f "$QT_TARGET_DIR/bin/qmake.exe" ]; then
            echo "ERROR: qmake.exe not found at $QT_TARGET_DIR/bin/qmake.exe"
            ls -la "$QT_TARGET_DIR/bin" || true
            kill $HEARTBEAT_PID || true
            exit 1
          fi

          echo "✓ Qt 5.15.2 installed at $QT_TARGET_DIR"
          echo "Note: Using Qt 5.15.2 (latest open-source) instead of 5.15.16"
          echo "      Binary compatibility within 5.15.x LTS series should ensure compatibility"
          kill $HEARTBEAT_PID || true

      - name: Download additional libraries (Luau, Jolt)
        working-directory: work/substrata/scripts
        shell: bash
        run: |
          set -euxo pipefail
          
          echo "Running get_libs.rb to download Luau and Jolt..."
          
          # Remove existing directories to force re-download
          rm -rf "$GLARE_CORE_LIBS/luau" || true
          rm -rf "$GLARE_CORE_LIBS/jolt" || true
          
          ruby get_libs.rb
          
          echo "✓ Additional libraries downloaded"

      # ---- Debug: Check CRT linkage of installed dependency libs and CMake runtime cache ----

      - name: Debug CRT linkage (check installed libs for debug CRT)
        shell: pwsh
        run: |
          Write-Host "=== Checking CRT linkage for installed dependency .lib files ==="

          $llvmInstallLibDirs = @()
          if (Test-Path "$env:BASE_DIR\\llvm") {
            $llvmInstallLibDirs = Get-ChildItem "$env:BASE_DIR\\llvm" -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like "*_install_vs2022_64" } |
              ForEach-Object { Join-Path $_.FullName "lib" } |
              Where-Object { Test-Path $_ }
          }

          $depsDirs = @(
            $llvmInstallLibDirs
            "$env:BASE_DIR\\libjpeg-turbo\\libjpeg-turbo-3.0.0-vs2022-install\\lib"
            "$env:BASE_DIR\\LibreSSL\\libressl-3.5.2-x64-vs2022-install\\lib"
          ) | Where-Object { Test-Path $_ }

          if ($depsDirs.Count -eq 0) {
            Write-Host "No dependency lib directories found to scan."
            exit 0
          }

          Write-Host "Scanning directories:"
          $depsDirs | ForEach-Object { Write-Host " - $_" }

          $debugCrtPattern = 'MSVCRTD|MSVCPRTD|LIBCMTD|UCRTD|VCRUNTIMED|msvcrtd|msvcprtd|libcmtd|ucrtd|vcruntimed'
          $offenders = @()

          foreach ($dir in $depsDirs) {
            Write-Host "`n---- Scanning: $dir ----"
            Get-ChildItem -Recurse $dir -Filter *.lib -File -ErrorAction SilentlyContinue | ForEach-Object {
              $file = $_.FullName
              try {
                $defaultLibLines = & dumpbin /directives $file 2>$null | Select-String 'DEFAULTLIB' | ForEach-Object { $_.Line }
                if ($defaultLibLines) {
                  $debugMatches = $defaultLibLines | Select-String $debugCrtPattern
                  if ($debugMatches) {
                    $offenders += [PSCustomObject]@{
                      File = $file
                      DebugDirectives = (($debugMatches | ForEach-Object { $_.Line.Trim() } | Select-Object -Unique) -join '; ')
                    }
                  }
                }
              } catch {
                Write-Host "  (failed dumpbin on $file)"
              }
            }
          }

          if ($offenders.Count -gt 0) {
            Write-Host "`nFound $($offenders.Count) libraries with debug CRT directives (showing up to 80):"
            $offenders | Select-Object -First 80 | ForEach-Object {
              Write-Host " - $($_.File)"
              Write-Host "   $($_.DebugDirectives)"
            }
            Write-Host "`nERROR: Release build cannot link against debug CRT libraries. Use a release-built deps archive."
            exit 1
          }

          Write-Host "✓ No debug CRT directives found in installed dependency libraries"

      - name: Ensure VS MSBuild & VCTargetsPath
        shell: pwsh
        run: |
          Write-Host "Locating Visual Studio installation with C++ tools..."
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            Write-Error "Visual Studio with C++ components not found via vswhere"
            exit 1
          }

          $msbuildDir = Join-Path $vsPath 'MSBuild\Current\Bin'
          Write-Host "Prepending MSBuild directory to PATH: $msbuildDir"
          $env:PATH = "$msbuildDir;" + $env:PATH
          Add-Content -Path $env:GITHUB_ENV -Value "PATH=$env:PATH"

          $msBuildExt = Join-Path $vsPath 'MSBuild'
          Write-Host "Setting MSBuildExtensionsPath to: $msBuildExt"
          Add-Content -Path $env:GITHUB_ENV -Value "MSBuildExtensionsPath=$msBuildExt"
          $env:MSBuildExtensionsPath = $msBuildExt

          # Locate Microsoft.Cpp.Default.props under the VS MSBuild tree and set VCTargetsPath accordingly
          Write-Host "Searching for Microsoft.Cpp.Default.props under: $(Join-Path $vsPath 'MSBuild\Microsoft\VC')"
          $propsFile = Get-ChildItem -Path (Join-Path $vsPath 'MSBuild\Microsoft\VC') -Recurse -Filter Microsoft.Cpp.Default.props -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($propsFile) {
            $vcTargetsPath = Split-Path $propsFile.FullName -Parent
            Write-Host "Found props at: $($propsFile.FullName)"
            Write-Host "Setting VCTargetsPath = $vcTargetsPath"
            Add-Content -Path $env:GITHUB_ENV -Value "VCTargetsPath=$vcTargetsPath"
            $env:VCTargetsPath = $vcTargetsPath
          } else {
            Write-Host "Microsoft.Cpp.Default.props not found under MSBuild VC tree; falling back to MSVC VCTargets location"
            $msvcTools = Get-ChildItem (Join-Path $vsPath 'VC\Tools\MSVC') -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
            if (-not $msvcTools) {
              Write-Error "MSVC Tools folder not found under $vsPath\\VC\\Tools\\MSVC"
              exit 1
            }
            $vcTargets = Join-Path $msvcTools.FullName 'VCTargets'
            Write-Host "Setting VCTargetsPath = $vcTargets"
            Add-Content -Path $env:GITHUB_ENV -Value "VCTargetsPath=$vcTargets"
            $env:VCTargetsPath = $vcTargets
          }

      - name: Create cmake wrapper to force x64 when Visual Studio generator used
        shell: pwsh
        run: |
          $real = $env:PINNED_CMAKE
          if (-not $real -or -not (Test-Path $real)) {
            Write-Host "PINNED_CMAKE not set or invalid; falling back to first cmake.exe in PATH"
            $real = (& where.exe cmake.exe) | Select-Object -First 1
          }
          if (-not $real) { Write-Error "cmake not found in PATH"; exit 1 }
          $wrapperDir = "${{ github.workspace }}\cmake-wrapper"
          New-Item -ItemType Directory -Path $wrapperDir -Force | Out-Null
          $wrapperBat = Join-Path $wrapperDir "cmake.bat"
          $content = @'
          @echo off
          set REAL_CMAKE=__REAL_CMAKE__
          set ALLARGS=%*
          rem If generator mentions Visual Studio 17 and no -A present, append -A x64
          echo %ALLARGS% | findstr /i /c:"Visual Studio 17" >nul
          if %errorlevel%==0 (
            echo %ALLARGS% | findstr /i /c:" -A " >nul
            if %errorlevel%==1 (
              "%REAL_CMAKE%" %ALLARGS% -A x64
              exit /b %ERRORLEVEL%
            )
          )
          "%REAL_CMAKE%" %ALLARGS%
          exit /b %ERRORLEVEL%
          '@
          $content = $content -replace '__REAL_CMAKE__', $real
          Set-Content -Path $wrapperBat -Value $content -Encoding ASCII
          Write-Host "Created cmake wrapper at: $wrapperBat"
          $env:PATH = "$wrapperDir;" + $env:PATH
          Add-Content -Path $env:GITHUB_ENV -Value "PATH=$($env:PATH)"

          

      - name: Configure CMake (Release, no CEF, Windows x64)
        shell: bash
        run: |
          mkdir -p "$BASE_DIR/substrata_build"
          cd "$BASE_DIR/substrata_build"
          cmake "$BASE_DIR/substrata" \
            -G "Visual Studio 17 2022" \
            -A x64 \
            -DCEF_SUPPORT="$CEF_SUPPORT" \
            -DBUGSPLAT_SUPPORT=OFF \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
          echo "-----------------------------"
          echo "CMAKE_MSVC_RUNTIME_LIBRARY setting in cache:"
          grep CMAKE_MSVC_RUNTIME_LIBRARY CMakeCache.txt || cat CMakeCache.txt
          echo "-----------------------------"

      - name: Build gui_client (cmake --build)
        shell: bash
        run: |
          (while true; do
            echo "[heartbeat] gui_client build running: $(date -u)"
            sleep 120
          done) &
          HEARTBEAT_PID=$!

          cd "$BASE_DIR/substrata_build"
          cmake --build . --config "$BUILD_CONFIG" --target gui_client

          kill $HEARTBEAT_PID || true

      - name: Locate gui_client.exe and run windeployqt
        shell: bash
        run: |
          set -euxo pipefail

          QT_BIN="$GLARE_CORE_LIBS/Qt/5.15.16-vs2022-64/bin"

          # The VS generator outputs to $CYBERSPACE_OUTPUT/vs2022/cyberspace_x64/<config>/
          EXE=""
          if [ -d "$CYBERSPACE_OUTPUT" ]; then
            EXE="$(find "$CYBERSPACE_OUTPUT" -name "gui_client.exe" -print -quit 2>/dev/null || true)"
          fi

          # Fallback: search build dir
          if [ -z "$EXE" ] && [ -d "$BASE_DIR/substrata_build" ]; then
            EXE="$(find "$BASE_DIR/substrata_build" -name "gui_client.exe" -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$EXE" ] || [ ! -f "$EXE" ]; then
            echo "gui_client.exe not found. Debug:"
            ls -la "$CYBERSPACE_OUTPUT" || true
            find "$BASE_DIR" -name "gui_client.exe" -print || true
            exit 1
          fi

          echo "Found gui_client.exe at: $EXE"

          "$QT_BIN/windeployqt.exe" --release "$EXE"

          echo "windeployqt finished. Contents of output dir:"
          ls -la "$(dirname "$EXE")" || true

      - name: Copy runtime files to output (no CEF)
        working-directory: work/substrata/scripts
        shell: bash
        run: |
          ruby copy_files_to_output.rb --no_cef

      - name: Show disk space (after build)
        shell: bash
        run: df -h || true

      - name: Create distributable zip from output directory
        id: package
        shell: bash
        run: |
          set -euxo pipefail

          # Find the directory containing gui_client.exe
          EXE="$(find "$CYBERSPACE_OUTPUT" -name "gui_client.exe" -print -quit 2>/dev/null || true)"
          if [ -z "$EXE" ]; then
            EXE="$(find "$BASE_DIR" -name "gui_client.exe" -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$EXE" ] || [ ! -f "$EXE" ]; then
            echo "gui_client.exe not found for packaging. Debug:"
            ls -la "$CYBERSPACE_OUTPUT" || true
            find "$BASE_DIR" -name "gui_client.exe" -print || true
            exit 1
          fi

          EXE_DIR="$(dirname "$EXE")"
          echo "Packaging output directory: $EXE_DIR"

          VERSION="$(ruby "$BASE_DIR/substrata/scripts/config.rb" --version || echo "unknown")"
          ZIP_NAME="substrata-windows-${VERSION}-gui_client-no-cef.zip"
          ZIP_PATH="${{ github.workspace }}/$ZIP_NAME"

          cd "$EXE_DIR"
          7z a -tzip "$ZIP_PATH" .

          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (short retention)
        if: ${{ github.event.inputs.create_release != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-gui-client
          path: ${{ steps.package.outputs.zip_path }}
          retention-days: 1

      - name: Validate release inputs
        if: ${{ github.event.inputs.create_release == 'true' }}
        shell: bash
        run: |
          if [ -z "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag_name is required when create_release=true"
            exit 1
          fi

      - name: Create GitHub Release (draft) and upload asset
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.tag_name }}
          draft: true
          generate_release_notes: true
          files: ${{ steps.package.outputs.zip_path }}
