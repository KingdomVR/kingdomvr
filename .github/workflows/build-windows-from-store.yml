# Build Windows gui_client using stored deps (Release, no CEF)
# Based on build-macos-from-store.yml
name: Build Windows gui_client using stored deps (Release, no CEF)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "If true, create a GitHub Release and upload the zip there"
        required: true
        default: "false"
      tag_name:
        description: "Release tag (required if create_release=true), e.g. v0.1.0"
        required: false
      deps_release_tag:
        description: "Tag in the deps store repo to download (optional). If empty, use latest."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022

    env:
      BASE_DIR: ${{ github.workspace }}/work

      # Glare build scripts expect these environment variables.
      GLARE_CORE_LIBS: ${{ github.workspace }}/work
      WINTER_DIR: ${{ github.workspace }}/work/winter
      GLARE_CORE_TRUNK_DIR: ${{ github.workspace }}/work/glare-core
      CYBERSPACE_OUTPUT: ${{ github.workspace }}/work/substrata_output

      CEF_SUPPORT: "OFF"
      BUILD_CONFIG: "Release"

      QT_VERSION: "5.15.2"
      QT_ARCH: "win64_msvc2019_64"
      QT_MSVC_DIR: "msvc2019_64"

      STORE_OWNER: "JerryBerry12"
      STORE_REPO: "kingdomvr-store-deps"

    steps:
      - name: Check STORE_REPO_PAT secret at runtime
        shell: bash
        run: |
          if [ -z "${{ secrets.STORE_REPO_PAT }}" ]; then
            echo "Secret STORE_REPO_PAT is required in this repository (a PAT with repo access to ${STORE_OWNER}/${STORE_REPO})."
            exit 1
          fi

      - name: Show runner + disk info (before)
        shell: bash
        run: |
          echo "OS: $RUNNER_OS"
          cmake --version || true
          ruby --version || true

      - name: Install minimal tools (Chocolatey)
        shell: pwsh
        run: |
          choco install jq -y --no-progress

      - name: Download deps archive from store repository
        id: download_asset
        shell: bash
        env:
          STORE_REPO_PAT: ${{ secrets.STORE_REPO_PAT }}
        run: |
          set -euxo pipefail

          TAG_INPUT="${{ github.event.inputs.deps_release_tag }}"
          API="https://api.github.com/repos/${STORE_OWNER}/${STORE_REPO}"

          if [ -n "$TAG_INPUT" ]; then
            echo "Using provided deps tag: $TAG_INPUT"
            REL_RESP=$(curl -s -H "Authorization: token ${STORE_REPO_PAT}" "${API}/releases/tags/${TAG_INPUT}")
          else
            echo "Getting latest deps release"
            REL_RESP=$(curl -s -H "Authorization: token ${STORE_REPO_PAT}" "${API}/releases/latest")
          fi

          ASSET_URL=$(echo "$REL_RESP" | jq -r '.assets[0].url // ""')
          ASSET_NAME=$(echo "$REL_RESP" | jq -r '.assets[0].name // ""')

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "No assets found in the selected deps release. Response:"
            echo "$REL_RESP"
            exit 1
          fi

          echo "Found asset: $ASSET_NAME"
          DEST="${{ github.workspace }}/$ASSET_NAME"

          # Download using the asset API url (requires Accept header)
          curl -L -H "Authorization: token ${STORE_REPO_PAT}" -H "Accept: application/octet-stream" \
            -o "$DEST" "$ASSET_URL"

          echo "downloaded_asset=$DEST" >> "$GITHUB_OUTPUT"

      - name: Extract archive into BASE_DIR
        shell: bash
        run: |
          set -euxo pipefail
          ARCHIVE="${{ steps.download_asset.outputs.downloaded_asset }}"
          if [ -z "$ARCHIVE" ] || [ ! -f "$ARCHIVE" ]; then
            echo "Archive not found at $ARCHIVE - attempting fallback search"
            ARCHIVE="$(ls "${{ github.workspace }}"/*kingdomvr-deps*.zip 2>/dev/null | head -n1 || true)"
            echo "Fallback archive: $ARCHIVE"
          fi
          if [ -z "$ARCHIVE" ] || [ ! -f "$ARCHIVE" ]; then
            echo "Archive not found."
            ls -la "${{ github.workspace }}"
            exit 1
          fi
          mkdir -p "$BASE_DIR"
          7z x "$ARCHIVE" -o"$BASE_DIR" -y
          echo "Extracted $ARCHIVE -> $BASE_DIR"

      - name: Checkout this repo (kingdomvr) into work/substrata (reclone)
        uses: actions/checkout@v4
        with:
          path: work/substrata

      - name: Checkout glare-core (JerryBerry12 fork) (reclone)
        uses: actions/checkout@v4
        with:
          repository: JerryBerry12/glare-core
          ref: master
          path: work/glare-core

      - name: Checkout winter (reclone)
        uses: actions/checkout@v4
        with:
          repository: glaretechnologies/winter
          path: work/winter

      - name: Provide Qt 5 for Windows (aqtinstall) and symlink into work/Qt/5.15.2
        shell: bash
        run: |
          set -euxo pipefail

          (while true; do
            echo "[heartbeat] qt provision running: $(date -u)"
            sleep 120
          done) &
          HEARTBEAT_PID=$!

          pip install aqtinstall

          QT_INSTALL_DIR="$BASE_DIR/Qt"
          mkdir -p "$QT_INSTALL_DIR"

          aqt install-qt windows desktop "$QT_VERSION" "$QT_ARCH" --outputdir "$QT_INSTALL_DIR"

          QT_PREFIX="$QT_INSTALL_DIR/$QT_VERSION/$QT_MSVC_DIR"
          echo "Qt installed at: $QT_PREFIX"

          if [ ! -f "$QT_PREFIX/bin/windeployqt.exe" ]; then
            echo "windeployqt.exe not found at $QT_PREFIX/bin/windeployqt.exe; listing $QT_PREFIX/bin:"
            ls -la "$QT_PREFIX/bin" || true
            kill $HEARTBEAT_PID || true
            exit 1
          fi

          echo "Qt provisioned at $QT_PREFIX"
          kill $HEARTBEAT_PID || true

      - name: Configure CMake (Release, no CEF, x64)
        shell: bash
        run: |
          mkdir -p "$BASE_DIR/substrata_build"
          cd "$BASE_DIR/substrata_build"
          cmake "$BASE_DIR/substrata" \
            -G "Visual Studio 17 2022" -A x64 \
            -DCEF_SUPPORT="$CEF_SUPPORT" \
            -DCMAKE_PREFIX_PATH="$BASE_DIR/Qt/$QT_VERSION/$QT_MSVC_DIR"

      - name: Build gui_client (Release)
        shell: bash
        run: |
          cd "$BASE_DIR/substrata_build"
          cmake --build . --config "$BUILD_CONFIG" --target gui_client -j 3

      - name: Copy runtime files to output (no CEF)
        shell: bash
        working-directory: work/substrata/scripts
        run: |
          ruby copy_files_to_output.rb --no_cef

      - name: Show disk space (after build)
        shell: bash
        run: df -h || true

      - name: Deploy Qt DLLs and create distributable zip
        id: package
        shell: bash
        run: |
          set -euxo pipefail

          BUILD_DIR="$BASE_DIR/substrata_build"
          EXE_PATH="$BUILD_DIR/$BUILD_CONFIG/gui_client.exe"

          if [ ! -f "$EXE_PATH" ]; then
            echo "Expected exe not found at: $EXE_PATH"
            ls -la "$BUILD_DIR/$BUILD_CONFIG" || ls -la "$BUILD_DIR" || true
            exit 1
          fi

          DIST_DIR="${{ github.workspace }}/dist"
          mkdir -p "$DIST_DIR"
          cp "$EXE_PATH" "$DIST_DIR/"

          # Run windeployqt to bundle Qt DLLs
          QT_BIN="$BASE_DIR/Qt/$QT_VERSION/$QT_MSVC_DIR/bin"
          WINDEPLOYQT="$QT_BIN/windeployqt.exe"
          if [ -x "$WINDEPLOYQT" ]; then
            "$WINDEPLOYQT" --release "$DIST_DIR/gui_client.exe"
          else
            echo "windeployqt not found at $WINDEPLOYQT; skipping Qt deployment"
          fi

          VERSION="$(ruby "$BASE_DIR/substrata/scripts/config.rb" --version || echo "unknown")"
          ZIP_NAME="substrata-windows-${VERSION}-gui_client-no-cef.zip"
          ZIP_PATH="${{ github.workspace }}/$ZIP_NAME"

          cd "$DIST_DIR"
          7z a -tzip "$ZIP_PATH" .

          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (short retention)
        if: ${{ inputs.create_release != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-gui-client
          path: ${{ steps.package.outputs.zip_path }}
          retention-days: 1

      - name: Validate release inputs
        if: ${{ inputs.create_release == 'true' }}
        shell: bash
        run: |
          if [ -z "${{ inputs.tag_name }}" ]; then
            echo "tag_name is required when create_release=true"
            exit 1
          fi

      - name: Create GitHub Release (draft) and upload asset
        if: ${{ inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.tag_name }}
          draft: true
          generate_release_notes: true
          files: ${{ steps.package.outputs.zip_path }}
